spring:
  application:
    name: spotly-api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

spotly:
  jwt:
    secret: spotly-super-secret-jwt-signing-key-minimum-256-bits-length-for-hmac-sha256
    expiration-seconds: 86400
